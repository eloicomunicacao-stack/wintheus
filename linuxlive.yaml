# wintheus, made with the linuxlive.com wizard on 2026-11-16.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "wintheus"
version: "6.7"
base: ubuntu
desktop: cinnamon
apps:
  - firefox
  - libreoffice
  - vlc
  - blender
  - discord
  - tuxpaint
  - lutris
  - krita
  - gimp
  - steam
  - heroic
  - gcompris
  - vscode
  - chromium
flathub:
  - com.google.Chrome
  - io.github.ungoogled_software.ungoogled_chromium
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#00838f"
  splash:
    script: assets/splash/splash.script
    images:
      - assets/splash/splash.png
settings:
  language: pt_BR
  keyboard: "br"
  timezone: America/Sao_Paulo
  hostname: wintheus
  autologin: true
  dock:
    - firefox
    - libreoffice
    - vlc
    - blender
    - discord
    - tuxpaint
    - lutris
    - com.google.Chrome
firefox:
  homepage: "https://www.google.com.br"
persistence: true
# Your own additions. Scripts and repos run as root; read them before you share the distro.
packages:
  - gparted
  - pavucontrol
  - vlc
  - gimp
  - mousepad
  - file-roller
  - htop
